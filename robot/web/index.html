<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小车控制台</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #12151a; color: #e6e9ef;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; min-height: 100vh; user-select: none;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: #1a1f27; border-bottom: 1px solid #2b323d; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #666; flex: none; }
  .dot.on { background: #35d07f; box-shadow: 0 0 8px #35d07f; }
  .dot.off { background: #e14b4b; }
  #connText { font-size: 12px; color: #8b95a5; }

  .status { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; padding: 12px 16px; }
  .chip { background: #1a1f27; border: 1px solid #2b323d; border-radius: 10px; padding: 8px 10px; text-align: center; }
  .chip .k { font-size: 11px; color: #8b95a5; margin-bottom: 3px; }
  .chip .v { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .chip .v small { font-size: 11px; color: #8b95a5; font-weight: 400; }
  .v.good { color: #35d07f; } .v.warn { color: #f0b429; } .v.bad { color: #e14b4b; }

  main { flex: 1; display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 16px; padding: 8px 16px 24px; align-items: start; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

  .col { display: flex; flex-direction: column; gap: 12px; }
  .padwrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #pad {
    width: min(300px, 76vw); height: min(300px, 76vw); border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #202733 0%, #171c24 70%);
    border: 2px solid #2f3846; position: relative; touch-action: none;
    box-shadow: inset 0 0 40px rgba(0,0,0,.5);
  }
  #pad::before, #pad::after { content: ''; position: absolute; background: #2a323f; }
  #pad::before { left: 50%; top: 8%; bottom: 8%; width: 2px; transform: translateX(-1px); }
  #pad::after { top: 50%; left: 8%; right: 8%; height: 2px; transform: translateY(-1px); }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 80px; height: 80px;
    margin: -40px 0 0 -40px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #5aa9ff, #2b6fd4);
    box-shadow: 0 6px 18px rgba(0,0,0,.45), inset 0 -3px 8px rgba(0,0,0,.3);
  }
  #pad.active #knob { background: radial-gradient(circle at 35% 30%, #7fd1a0, #2ea36a); }
  .hint { font-size: 12px; color: #7b869a; text-align: center; }

  .row { display: flex; gap: 10px; }
  button {
    flex: 1; padding: 13px 10px; border-radius: 12px; border: 1px solid #2f3846;
    background: #222a35; color: #e6e9ef; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: .15s; font-family: inherit;
  }
  button:hover { background: #2a3442; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.go { background: #1f5c3d; border-color: #2f7a52; }
  button.go:hover { background: #256b47; }
  button.stop { background: #5c2020; border-color: #8a3232; }
  button.stop:hover { background: #6f2626; }
  button.estop { background: #b3261e; border-color: #e14b4b; font-size: 17px; padding: 18px 10px; }
  button.estop:hover { background: #c9302a; }

  .panel { background: #1a1f27; border: 1px solid #2b323d; border-radius: 12px; padding: 12px; }
  .panel h3 { margin: 0 0 10px; font-size: 12px; color: #8b95a5; font-weight: 600; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; }
  .panel h3 .sp { flex: 1; }
  .panel h3 button { flex: none; padding: 4px 10px; font-size: 11px; border-radius: 7px; }
  .slider { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .slider label { font-size: 12px; color: #a8b2c1; width: 58px; flex: none; }
  .slider input[type=range] { flex: 1; accent-color: #5aa9ff; height: 22px; }
  .slider .val { font-size: 12px; width: 66px; text-align: right; font-variant-numeric: tabular-nums; color: #cfd6e0; }
  .seg { display: flex; gap: 8px; }
  .seg button { padding: 9px 6px; font-size: 13px; }
  .seg button.sel { background: #2b6fd4; border-color: #4a8be8; }

  /* 地图 */
  #mapBox {
    background: #0d1014; border: 1px solid #232a34; border-radius: 10px;
    min-height: 180px; display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  #liveMap { max-width: 100%; max-height: 46vh; image-rendering: pixelated; display: none; }
  #mapEmpty { color: #5d6879; font-size: 13px; padding: 40px 0; }
  #camBox {
    background: #0d1014; border: 1px solid #232a34; border-radius: 10px;
    min-height: 160px; display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  #camImg { max-width: 100%; max-height: 40vh; display: none; }
  #camEmpty { color: #5d6879; font-size: 13px; padding: 34px 10px; text-align: center; line-height: 1.8; }
  #mapBadge {
    position: absolute; left: 8px; top: 8px; background: rgba(0,0,0,.65);
    padding: 3px 9px; border-radius: 6px; font-size: 11px; color: #9fb0c4;
  }
  #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; max-height: 210px; overflow-y: auto; margin-top: 10px; }
  .thumb { border: 1px solid #2b323d; border-radius: 9px; overflow: hidden; cursor: pointer; background: #0d1014; }
  .thumb:hover { border-color: #4a8be8; }
  .thumb img { width: 100%; height: 76px; object-fit: cover; display: block; background: #161b22; }
  .thumb .nm { font-size: 10px; padding: 4px 6px; color: #a8b2c1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thumb .tm { font-size: 9px; padding: 0 6px 5px; color: #5d6879; }
  .empty { font-size: 12px; color: #5d6879; padding: 12px 0; }

  #nameInput {
    flex: 1; padding: 11px 12px; border-radius: 11px; border: 1px solid #2f3846;
    background: #151a21; color: #e6e9ef; font-size: 13px; font-family: inherit; min-width: 0;
  }
  #nameInput::placeholder { color: #5d6879; }

  #viewer {
    position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none;
    align-items: center; justify-content: center; z-index: 200; padding: 24px;
  }
  #viewer img { max-width: 100%; max-height: 100%; image-rendering: pixelated; }
  #viewer.show { display: flex; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(90px);
    background: #2b3440; border: 1px solid #3d4a5c; padding: 11px 20px; border-radius: 10px;
    font-size: 13px; opacity: 0; transition: .25s; pointer-events: none; max-width: 88vw;
    text-align: center; z-index: 210;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.err { background: #4a2323; border-color: #8a3232; }
</style>
</head>
<body>

<header>
  <h1>WHEELTEC 麦轮小车</h1>
  <div class="dot off" id="connDot"></div>
  <span id="connText">连接中…</span>
  <span style="flex:1"></span>
  <span id="stackText" style="font-size:12px;color:#8b95a5">全栈状态未知</span>
</header>

<div class="status">
  <div class="chip"><div class="k">电压</div><div class="v" id="sVolt">--<small> V</small></div></div>
  <div class="chip"><div class="k">里程计</div><div class="v" id="sOdom">--<small> Hz</small></div></div>
  <div class="chip"><div class="k">激光雷达</div><div class="v" id="sScan">--<small> Hz</small></div></div>
  <div class="chip"><div class="k">IMU</div><div class="v" id="sImu">--<small> Hz</small></div></div>
  <div class="chip"><div class="k">SLAM</div><div class="v" id="sSlam">--</div></div>
  <div class="chip"><div class="k">位姿跳变</div><div class="v" id="sJump">--</div></div>
  <div class="chip"><div class="k">位姿 X/Y</div><div class="v" id="sPose" style="font-size:13px">--</div></div>
  <div class="chip"><div class="k">朝向</div><div class="v" id="sYaw">--<small>°</small></div></div>
</div>

<main>
  <!-- 左列：控制 -->
  <div class="col">
    <div class="panel">
      <div class="padwrap">
        <div id="pad"><div id="knob"></div></div>
        <div class="hint" id="padHint">拖动圆盘控制 · 松手即停</div>
      </div>
    </div>

    <div class="row"><button class="estop" id="btnEstop">急停</button></div>
    <div class="row">
      <button class="go" id="btnStart">启动全栈</button>
      <button class="stop" id="btnStop">停止全栈</button>
    </div>

    <div class="panel">
      <h3>速度上限</h3>
      <div class="slider">
        <label>线速度</label>
        <input type="range" id="linRange" min="3" max="20" value="12">
        <span class="val" id="linVal">0.12 m/s</span>
      </div>
      <div class="slider">
        <label>角速度</label>
        <input type="range" id="angRange" min="10" max="70" value="40">
        <span class="val" id="angVal">0.40 rad/s</span>
      </div>
      <div class="seg">
        <button id="modeRot" class="sel">左右转</button>
        <button id="modeStrafe">横移</button>
      </div>
    </div>
  </div>

  <!-- 右列：摄像头 + 地图 -->
  <div class="col">
    <div class="panel">
      <h3>摄像头
        <span class="sp"></span>
        <button id="btnCamToggle">暂停</button>
        <button id="btnCamSnap">截图</button>
      </h3>
      <div id="camBox">
        <div id="camEmpty">没有摄像头画面<br><span style="font-size:11px">接上 Astra Pro 并启动 v4l2_camera 后自动出现</span></div>
        <img id="camImg" alt="camera">
      </div>
    </div>

    <div class="panel">
      <h3>实时地图
        <span class="sp"></span>
        <button id="btnMapRefresh">刷新</button>
      </h3>
      <div id="mapBox">
        <div id="mapEmpty">暂无地图数据（启动全栈并建图后自动出现）</div>
        <img id="liveMap" alt="实时地图">
        <div id="mapBadge" style="display:none"></div>
      </div>
    </div>

    <div class="panel">
      <h3>已保存地图</h3>
      <div class="row" style="margin-bottom:10px">
        <input id="nameInput" placeholder="地图名（留空自动命名）">
        <button class="go" id="btnSaveMap">保存当前地图</button>
      </div>
      <div id="gallery"><div class="empty">加载中…</div></div>
    </div>
  </div>
</main>

<div id="viewer"><img id="viewerImg" alt=""></div>
<div id="toast"></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const state = {
  ws: null, connected: false, running: false,
  linMax: 0.12, angMax: 0.40, latMax: 0.10,
  mode: 'rot',
  stick: { x: 0, y: 0, active: false },
  sendTimer: null,
  ctrlDisabled: true,
  liveTimer: null,
};

let toastTimer = null;
function toast(msg, isErr) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 2800);
}

// -------------------------------------------------- WebSocket
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  state.ws = ws;
  ws.onopen = () => {
    state.connected = true;
    $('connDot').className = 'dot on';
    $('connText').textContent = '已连接';
    applyControlState();
  };
  ws.onclose = () => {
    state.connected = false;
    $('connDot').className = 'dot off';
    $('connText').textContent = '已断开，重连中…';
    applyControlState();
    setTimeout(connect, 1500);
  };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.type === 'status') renderStatus(m.data);
  };
}
function send(o) {
  if (state.ws && state.ws.readyState === 1) { state.ws.send(JSON.stringify(o)); return true; }
  return false;
}

// -------------------------------------------------- 状态
function setV(id, html, cls) {
  const el = $(id);
  el.className = 'v' + (cls ? ' ' + cls : '');
  el.innerHTML = html;
}
function renderStatus(d) {
  if (!d) return;
  state.running = !!d.running;
  $('stackText').textContent = d.running ? '全栈运行中' : '全栈已停止';
  $('stackText').style.color = d.running ? '#35d07f' : '#8b95a5';
  applyControlState();

  const v = d.voltage;
  if (v !== null && v !== undefined) {
    setV('sVolt', v.toFixed(2) + '<small> V</small>', v < 10.5 ? 'bad' : (v < 11.5 ? 'warn' : 'good'));
  } else setV('sVolt', '--<small> V</small>', '');

  const hz = (id, val, need) => {
    if (!val) { setV(id, '--<small> Hz</small>', ''); return; }
    setV(id, val.toFixed(1) + '<small> Hz</small>', val >= need * 0.6 ? 'good' : (val > 0.5 ? 'warn' : 'bad'));
  };
  hz('sOdom', d.odom_hz, 20); hz('sScan', d.scan_hz, 8.7); hz('sImu', d.imu_hz, 100);

  // SLAM 状态 + 位姿跳变
  if (!d.monitor_alive) {
    setV('sSlam', '未监控', '');
    setV('sJump', '--', '');
  } else {
    const active = !!d.slam_active;
    setV('sSlam', active ? '已激活' : '未激活', active ? 'good' : 'bad');
    const n = d.jump_count || 0;
    if (n === 0) {
      setV('sJump', '0', 'good');
    } else {
      const lj = d.last_jump;
      const tip = lj ? `最近: t=${lj.t}s 位移${lj.dxy}m 转角${lj.dyaw}°` : '';
      setV('sJump', String(n), 'bad');
      $('sJump').title = tip;
    }
  }

  if (d.x !== undefined) setV('sPose', `${d.x.toFixed(2)}, ${d.y.toFixed(2)}`, '');
  if (d.yaw_deg !== undefined) setV('sYaw', d.yaw_deg.toFixed(0) + '<small>°</small>', '');

  if (d.map_alive) { startLiveMap(); } else { stopLiveMap(); }
  updateCamera(d);
}

function applyControlState() {
  const ready = state.connected && state.running;
  $('btnEstop').disabled = !state.connected;
  $('btnStart').disabled = !state.connected || state.running;
  $('btnStop').disabled = !state.connected || !state.running;
  $('btnSaveMap').disabled = !state.connected || !state.running;
  $('pad').style.opacity = ready ? '1' : '.45';
  $('padHint').textContent = ready ? '拖动圆盘控制 · 松手即停'
                                   : (state.connected ? '全栈未运行，先点「启动全栈」' : '未连接');
  if (!ready) resetStick();
  state.ctrlDisabled = !ready;
}

// -------------------------------------------------- 摇杆
const pad = $('pad'), knob = $('knob');
let padRect = null;
function padCenter() {
  padRect = pad.getBoundingClientRect();
  return { cx: padRect.left + padRect.width / 2, cy: padRect.top + padRect.height / 2, r: padRect.width / 2 };
}
function setKnob(nx, ny) {
  const { r } = padCenter();
  const m = r - 44;
  knob.style.transform = `translate(${nx * m}px, ${ny * m}px)`;
}
function updateFromPointer(cx0, cy0) {
  const { cx, cy, r } = padCenter();
  let dx = cx0 - cx, dy = cy0 - cy, m = r - 44;
  const d = Math.hypot(dx, dy);
  if (d > m) { dx = dx / d * m; dy = dy / d * m; }
  state.stick.x = dx / m; state.stick.y = dy / m; state.stick.active = true;
  setKnob(state.stick.x, state.stick.y);
  pad.classList.add('active');
  startSendLoop();
}
function resetStick() {
  state.stick.x = state.stick.y = 0; state.stick.active = false;
  knob.style.transform = 'translate(0px,0px)';
  pad.classList.remove('active');
  stopSendLoop();
  send({ type: 'stop' });
}
function startSendLoop() {
  if (state.sendTimer) return;
  state.sendTimer = setInterval(sendTeleop, 50);
}
function stopSendLoop() {
  if (state.sendTimer) { clearInterval(state.sendTimer); state.sendTimer = null; }
}
function sendTeleop() {
  if (state.ctrlDisabled) return;
  const { x, y } = state.stick;
  const vx = -y * state.linMax;
  let vy = 0, wz = 0;
  if (state.mode === 'rot') wz = -x * state.angMax;
  else vy = -x * state.latMax;
  send({ type: 'teleop', vx, vy, wz });
}
pad.addEventListener('pointerdown', e => {
  if (state.ctrlDisabled) { toast('全栈未运行', true); return; }
  pad.setPointerCapture(e.pointerId);
  updateFromPointer(e.clientX, e.clientY);
});
pad.addEventListener('pointermove', e => { if (state.stick.active) updateFromPointer(e.clientX, e.clientY); });
const endPad = e => {
  if (pad.hasPointerCapture && pad.hasPointerCapture(e.pointerId)) pad.releasePointerCapture(e.pointerId);
  resetStick();
};
pad.addEventListener('pointerup', endPad);
pad.addEventListener('pointercancel', endPad);
pad.addEventListener('lostpointercapture', () => resetStick());

// -------------------------------------------------- 地图
let liveFail = 0;
function startLiveMap() {
  if (state.liveTimer) return;
  refreshLiveMap();
  state.liveTimer = setInterval(refreshLiveMap, 2000);
}
function stopLiveMap() {
  if (state.liveTimer) { clearInterval(state.liveTimer); state.liveTimer = null; }
}
function refreshLiveMap() {
  const img = $('liveMap');
  const t = Date.now();
  img.onload = () => {
    liveFail = 0;
    img.style.display = 'block';
    $('mapEmpty').style.display = 'none';
    $('mapBadge').style.display = 'block';
    $('mapBadge').textContent = `实时地图 · ${img.naturalWidth}×${img.naturalHeight} px · ${new Date().toLocaleTimeString()}`;
  };
  img.onerror = () => {
    liveFail++;
    if (liveFail > 3) { img.style.display = 'none'; $('mapEmpty').style.display = 'block'; }
  };
  img.src = '/api/live_map?scale=3&t=' + t;
}
$('btnMapRefresh').onclick = () => { refreshLiveMap(); loadMaps(); };
$('liveMap').onclick = () => showViewer($('liveMap').src, '实时地图');

function showViewer(src, title) {
  $('viewerImg').src = src;
  $('viewer').classList.add('show');
  $('viewer').onclick = () => $('viewer').classList.remove('show');
}

async function loadMaps() {
  try {
    const r = await (await fetch('/api/maps')).json();
    const g = $('gallery');
    if (!r.maps || !r.maps.length) { g.innerHTML = '<div class="empty">暂无已保存地图</div>'; return; }
    g.innerHTML = r.maps.slice(0, 12).map(m => {
      const src = m.has_pgm ? `/api/map_image?name=${encodeURIComponent(m.name)}&t=${Date.now()}` : '';
      return `<div class="thumb" data-name="${m.name}" data-src="${src}">
        ${src ? `<img src="${src}" loading="lazy" alt="">` : '<div style="height:76px"></div>'}
        <div class="nm">${m.name}</div><div class="tm">${m.mtime}</div></div>`;
    }).join('');
    g.querySelectorAll('.thumb').forEach(el => {
      el.onclick = () => { if (el.dataset.src) showViewer(el.dataset.src, el.dataset.name); };
    });
  } catch (e) { $('gallery').innerHTML = '<div class="empty">读取失败</div>'; }
}

// -------------------------------------------------- 摄像头
const camState = { alive: false, paused: false };

function updateCamera(d) {
  const img = $('camImg'), empty = $('camEmpty');
  camState.alive = !!d.camera_alive;
  if (camState.paused) return;
  if (camState.alive) {
    if (!img.getAttribute('src')) img.src = '/api/camera.mjpg?t=' + Date.now();
    img.style.display = 'block';
    empty.style.display = 'none';
  } else {
    if (img.getAttribute('src')) img.removeAttribute('src');
    img.style.display = 'none';
    empty.style.display = 'block';
  }
}

$('btnCamToggle').onclick = () => {
  camState.paused = !camState.paused;
  $('btnCamToggle').textContent = camState.paused ? '继续' : '暂停';
  const img = $('camImg'), empty = $('camEmpty');
  if (camState.paused) {
    img.removeAttribute('src');
    img.style.display = 'none';
    empty.style.display = 'block';
    empty.textContent = '已暂停';
  } else {
    empty.innerHTML = '没有摄像头画面<br><span style="font-size:11px">接上 Astra Pro 并启动 v4l2_camera 后自动出现</span>';
  }
};

$('btnCamSnap').onclick = () => {
  window.open('/api/camera.jpg?t=' + Date.now(), '_blank');
};

$('camImg').onclick = () => {
  if ($('camImg').getAttribute('src')) {
    showViewer('/api/camera.jpg?t=' + Date.now(), '摄像头');
  }
};

// -------------------------------------------------- 按钮
async function api(path, body) {
  const opt = { method: 'POST', headers: { 'Content-Type': 'application/json' } };
  if (body) opt.body = JSON.stringify(body);
  const r = await fetch(path, opt);
  return r.json();
}
// 用后端返回的 running 立即刷新界面，不等下一次 WS 推送
function syncRunning(r) {
  if (!r || r.running === undefined) return;
  state.running = !!r.running;
  $('stackText').textContent = state.running ? '全栈运行中' : '全栈已停止';
  $('stackText').style.color = state.running ? '#35d07f' : '#8b95a5';
  applyControlState();
}

$('btnStart').onclick = async () => {
  toast('正在启动全栈…（约 90 秒）');
  try {
    const r = await api('/api/start');
    syncRunning(r);
    toast(r.ok ? '启动指令已发送' : ('启动失败: ' + r.msg), !r.ok);
  } catch (e) { toast('请求失败', true); }
};
$('btnStop').onclick = async () => {
  $('btnStop').disabled = true;
  toast('正在停止全栈…');
  try {
    const r = await api('/api/stop');
    syncRunning(r);
    if (r.ok) toast(r.running ? '停止命令已执行，但仍有进程在运行' : '全栈已停止');
    else toast('停止失败: ' + r.msg, true);
  } catch (e) { toast('请求失败', true); }
  $('btnStop').disabled = false;
};
$('btnEstop').onclick = () => { resetStick(); send({ type: 'stop' }); toast('已急停'); };
$('btnSaveMap').onclick = async () => {
  const name = $('nameInput').value.trim();
  $('btnSaveMap').disabled = true;
  toast('正在保存地图…');
  try {
    const r = await api('/api/save_map', name ? { name } : {});
    if (r.ok) { toast('地图已保存: ' + r.name); $('nameInput').value = ''; loadMaps(); }
    else toast('保存失败: ' + (r.msg || ''), true);
  } catch (e) { toast('请求失败', true); }
  $('btnSaveMap').disabled = false;
};

// -------------------------------------------------- 滑条/模式
function bindRange(rid, vid, fn, fmt) {
  const r = $(rid), v = $(vid);
  const apply = () => { const x = fn(parseInt(r.value, 10)); v.textContent = fmt(x); };
  r.addEventListener('input', apply);
  apply();
}
bindRange('linRange', 'linVal', raw => { state.linMax = raw / 100; return state.linMax; }, x => x.toFixed(2) + ' m/s');
bindRange('angRange', 'angVal', raw => { state.angMax = raw / 100; return state.angMax; }, x => x.toFixed(2) + ' rad/s');
$('modeRot').onclick = () => { state.mode = 'rot'; $('modeRot').classList.add('sel'); $('modeStrafe').classList.remove('sel'); };
$('modeStrafe').onclick = () => { state.mode = 'strafe'; $('modeStrafe').classList.add('sel'); $('modeRot').classList.remove('sel'); };

// -------------------------------------------------- 安全
window.addEventListener('blur', () => resetStick());
document.addEventListener('visibilitychange', () => { if (document.hidden) resetStick(); });
window.addEventListener('beforeunload', () => { try { resetStick(); } catch (e) {} });

// -------------------------------------------------- 启动
connect();
loadMaps();
setInterval(loadMaps, 30000);
})();
</script>
</body>
</html>
